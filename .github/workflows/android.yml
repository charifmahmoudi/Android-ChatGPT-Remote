name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests, lint, and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk android-chatgpt-remote-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-chatgpt-remote-debug-apk
          path: android-chatgpt-remote-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS=="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: aosp_atd
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb keygen "${RUNNER_TEMP}/android-chatgpt-remote-ci-adb-key"
            adb pubkey "${RUNNER_TEMP}/android-chatgpt-remote-ci-adb-key" > "${RUNNER_TEMP}/android-chatgpt-remote-ci-adb-key.pub"
            adb root
            adb wait-for-device
            adb push "${RUNNER_TEMP}/android-chatgpt-remote-ci-adb-key.pub" /data/local/tmp/android-chatgpt-remote-ci-adb-key.pub
            adb shell 'cat /data/local/tmp/android-chatgpt-remote-ci-adb-key.pub >> /data/misc/adb/adb_keys'
            adb shell chmod 640 /data/misc/adb/adb_keys
            adb tcpip 5555
            adb wait-for-device
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.ciAdbPrivateKey="$(base64 --wrap=0 "${RUNNER_TEMP}/android-chatgpt-remote-ci-adb-key")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
